name: expense_calculator
description: "Simple Expense Calculator - Track daily expenses and monthly budgets"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.9

  # State Management
  provider: ^6.1.2

  # UI & Utilities
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1
  fl_chart: ^0.70.2
  firebase_auth: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
